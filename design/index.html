:root{--bg:#000;--fg:#fff;--mute:#8c8c8c;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.3);--serif:'Instrument Serif',Georgia,serif;--body:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--gut:max(16px,env(safe-area-inset-left,0px))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{background:#000;color:#fff;font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.lbl,.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--mute)}
.top{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gut);background:rgba(0,0,0,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}.brand b{font-weight:700;font-size:19px;letter-spacing:-.045em}.brand i{width:1px;height:22px;background:var(--line2)}.brand small{font-family:var(--mono);font-size:6.5px;letter-spacing:.24em;line-height:1.4;color:#bbb}
.wa{background:#fff;color:#000;font-size:12.5px;font-weight:500;padding:8px 11px;display:flex;gap:6px;align-items:center}.wa i{width:13px;height:13px;border-radius:50%;background:#1faa53}
.wrap{padding:16px var(--gut) 110px;max-width:1180px;margin:0 auto}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,11vw,78px);line-height:.95;letter-spacing:-.02em}h1 em{font-style:italic}
.kr{display:flex;justify-content:space-between;padding:2px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);padding:0 14px;height:52px;margin:20px 0 12px}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:16px var(--body);outline:none}.search input::placeholder{color:#777}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gut));padding:0 var(--gut)}.hs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);padding:0 13px;height:36px;font-size:13px;white-space:nowrap;color:#ddd;display:inline-flex;align-items:center;gap:6px}.chip.on{background:#fff;color:#000;border-color:#fff}
.chip svg{width:15px;height:15px}
.res{margin-top:16px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.row .ic{width:54px;height:36px;position:relative}.row .ic span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid var(--line2);border-radius:3px}
.row b{display:block;font-weight:500;font-size:15px;line-height:1.25}.row .lbl{font-size:9.5px;margin-top:3px;display:block}
.tagg{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;color:#bbb}
.more{width:100%;height:48px;border:1px solid var(--line2);margin-top:14px}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr)}
.stage{position:sticky;top:58px;z-index:20;height:min(44vh,420px);height:min(44svh,420px);margin:0 calc(-1*var(--gut));background:radial-gradient(120% 100% at 50% 40%,#ffffff 0%,#f6f6f6 55%,#ececec 100%);overflow:hidden;touch-action:none;color:#111}
.stage canvas{display:block;width:100%;height:100%}
.ovl{position:absolute;left:var(--gut);right:var(--gut);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.ovl>*{pointer-events:auto}
.ovl.t{top:12px}
.chg{color:#fff;border-bottom:1px solid var(--line2);padding:4px 0;text-decoration:none}
.stage .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;max-width:none!important;pointer-events:none}
.ctrl{display:flex;gap:10px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.views{display:grid;grid-template-columns:repeat(4,1fr);flex:1 1 230px;border:1px solid var(--line2)}
.views button{height:40px;font-size:13px;color:#bbb;font-weight:500}.views button+button{border-left:1px solid var(--line)}.views button.on{background:#fff;color:#000}
.ctrl .lidc{flex:1 1 150px;height:42px;border:1px solid var(--line2);background:none;backdrop-filter:none;padding:0 12px;display:flex;align-items:center;gap:12px}
.ctrl .lidc input{flex:1;width:auto}
.drawer{gap:12px!important}.addto .seg{margin-left:12px}
.name b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}.name .lbl{display:block;margin-top:4px}
.vbtn{display:grid;gap:6px}
.vbtn button{width:44px;height:40px;border:1px solid var(--line2);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:grid;place-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.08em}
.vbtn button.on{background:#fff;color:#000}
.lidc{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid var(--line);padding:8px 12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--line2);outline:none;width:110px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#fff;border-radius:50%}
.hint{max-width:46%;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#aaa;background:rgba(0,0,0,.5);padding:6px 9px}
.selbar{margin:12px 0 4px;background:#0b0b0b;border:1px solid var(--line2);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.selbar input{width:100%}.selbar .btns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.selbar .btns button{height:38px;border:1px solid var(--line2);font-size:13px}.selbar .btns button.w{background:#fff;color:#000;border-color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line2)}.seg>*{text-align:center;padding:10px 0;font-size:13.5px;color:#a9a9a9;font-weight:500}.seg>.on{background:#fff;color:#000}
.seg i{font-style:normal;font-family:var(--mono);font-size:10px;opacity:.6;margin-left:3px}
.drawer{display:grid;gap:10px;padding-top:12px;grid-template-columns:minmax(0,1fr)}
.addto{display:flex;align-items:center;justify-content:space-between}
.tray{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,64px);grid-auto-columns:64px;gap:6px;overflow-x:auto;scrollbar-width:none}.tray::-webkit-scrollbar{display:none}
.tile{background:rgba(255,255,255,.05);display:grid;place-items:center;position:relative;height:64px}.tile .c{position:absolute;left:2px;bottom:1px;font-family:var(--mono);font-size:7.5px;color:#aaa}
.skins{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:92px;gap:8px;overflow-x:auto;scrollbar-width:none}.skins::-webkit-scrollbar{display:none}
.sk{display:grid;gap:5px;text-align:left}.sk span:first-child{aspect-ratio:3/2;background:#111 center/cover;border:1px solid var(--line)}.sk.on span:first-child{outline:1px solid #fff;outline-offset:2px}.sk .lbl{font-size:8.5px;letter-spacing:.06em}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols button{display:grid;justify-items:center;gap:5px;font-size:11px;color:var(--mute)}.cols i{width:38px;height:38px;border-radius:50%;display:block}.cols .on i{outline:1px solid #fff;outline-offset:3px}.cols .on{color:#fff}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.acts .btn{min-width:0;padding:0 4px;font-size:14px}.acts .btn.y{grid-column:1/-1}.btn{height:50px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;border:1px solid var(--line2)}.btn.y{background:#fff;color:#000;border-color:#fff;justify-content:space-between;padding:0 16px}.btn.y:after{content:"→"}
.s{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;height:66px;border-top:1px solid var(--line);background:rgba(0,0,0,.94);display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#7d7d7d;position:relative}.tabs svg{width:22px;height:22px}.tabs .on{color:#fff}.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#7d7d7d;position:relative}.tabs .on:after{content:"";position:absolute;bottom:5px;width:14px;height:1px;background:#fff}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:#000;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:9px 14px;z-index:300}
.load{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#888}
@media (min-width:1000px){.ed{grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}.stage{margin:0;height:min(76vh,720px);top:76px}.drawer{position:sticky;top:76px;padding-top:0}
  .tray{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(5,1fr);max-height:260px;overflow-y:auto}.skins{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(3,1fr);max-height:300px;overflow-y:auto}
  .tabs{display:none}.wrap{padding-bottom:40px}}
.dm{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 14px;border:1px solid var(--line2);color:#fff;text-decoration:none;font-size:14px;font-weight:500}.dm span:first-child:before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#1faa53;margin-right:9px}

.top{gap:10px}.brand{padding:8px 0;min-height:44px}
.chg{display:inline-flex;align-items:center;min-height:40px;padding:0 2px}
.addto{flex-wrap:wrap;gap:8px}.addto .seg{min-width:240px}
.tile .c{font-size:8.5px}.row .lbl{font-size:10px}.tagg{font-size:9.5px}
.views button{min-height:42px}
@media (max-width:380px){
  .wa{padding:8px 10px;font-size:12px}.wa .t{display:none}
  .brand small{display:none}.brand i{display:none}
  .addto{display:grid;grid-template-columns:1fr}.addto .seg{margin-left:0!important;min-width:0}
  .acts{grid-template-columns:repeat(4,minmax(0,1fr));}.acts .btn.y{grid-column:1/-1}
  h1{font-size:40px}
  .stage{height:min(40vh,360px);height:min(40svh,360px)}
  .name b{font-size:20px}
}
@media (max-width:999px){.ed>div:first-child{display:contents}.stage{box-shadow:0 10px 20px rgba(0,0,0,.6)}}

.stage .name b{color:#111}.stage .lbl{color:#777}
.stage .chg{color:#111;border-bottom-color:rgba(0,0,0,.25)}.name .chg{display:inline-block;min-height:0;padding:12px 6px;margin:-12px -6px;background-clip:content-box;border-bottom:1px solid rgba(0,0,0,.3);color:#111}
.stage .hint{background:rgba(255,255,255,.85);color:#666;border:1px solid rgba(0,0,0,.08)}
.stage .load{color:#999}
@media (max-width:999px){.stage{box-shadow:0 1px 0 rgba(255,255,255,.08)!important}}
.ph{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 100% at 50% 40%,#fff 0%,#fafafa 60%,#f1f1f1 100%);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.phz{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.phz img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .25s;filter:drop-shadow(0 22px 22px rgba(0,0,0,.13));-webkit-user-drag:none;pointer-events:none}
.stage .phz #phl{filter:brightness(.95) contrast(1.03) saturate(.97)}.stage .phz canvas{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;width:auto;height:auto;display:block}
.phm{position:absolute;left:var(--gut);right:var(--gut);bottom:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}.stage .phm .lbl{color:#9a9a9a}
