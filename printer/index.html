<style>

/* ---------- Skin Lab admin · dark, calm, nothing overlaps: every row wraps, every text can shrink ---------- */
:root{--bg:#09090b;--s1:#111114;--s2:#17171b;--s3:#1f1f25;--fg:#f4f4f5;--mute:#9a9aa3;--dim:#6b6b74;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;min-width:0}[hidden]{display:none!important}

:focus-visible{outline:2px solid var(--y);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.lbl{font-family:var(--mono);font-size:10.5px;line-height:1.4;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
/* top bar: brand + tabs on their own scrolling row, so nothing ever squeezes */
.top{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:0 var(--gut);max-width:1180px;margin:0 auto}
.top b.brand{font-weight:700;font-size:19px;letter-spacing:-.045em;white-space:nowrap}.top b.brand span{color:var(--mute);font-weight:500;font-size:13px;letter-spacing:0;margin-left:8px}
.me{display:flex;gap:8px;align-items:center}.me .who{font-size:12.5px;color:var(--mute);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav button:hover{background:var(--s2)}.nav button.on{background:var(--fg);color:#000}
.nav i{font-style:normal;font-family:var(--mono);font-size:10.5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--g);color:#000;display:inline-grid;place-items:center}
.nav button.on i{background:#000;color:#fff}

.ib:hover{border-color:rgba(255,255,255,.3)}.ib:disabled{opacity:.5}.ib.warn{border-color:rgba(250,204,21,.5);color:var(--y)}.ib.bad{border-color:rgba(248,113,113,.45);color:var(--r)}.ib.solid{background:var(--fg);color:#000;border-color:var(--fg)}
.w{max-width:1180px;margin:0 auto;padding:18px var(--gut) 90px}

h2{font-size:15px;font-weight:600;margin:0 0 10px}
/* dashboard */

.bars p{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.bars p:last-child{border:0}.bars p span{flex:1}.bars p b{flex:none}

.srch:focus,.inp:focus,select:focus,textarea.msg:focus{border-color:rgba(255,255,255,.4)}
select{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}

.card:hover{border-color:var(--line2);background:var(--s2)}.card.new{border-color:rgba(250,204,21,.55)}
.card .pic{width:76px;height:100px;border-radius:var(--rad2);background:var(--s3) center/cover;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.card .body{display:grid;gap:3px;align-content:start}.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}

.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:22px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:0 8px;border-radius:999px;white-space:nowrap;background:var(--s3);color:#d4d4d8}
.pill.new{background:var(--ybg);color:var(--y)}.pill.confirmed,.pill.artwork{background:var(--bbg);color:var(--b)}.pill.printing,.pill.qc{background:var(--pbg);color:var(--p)}.pill.ready,.pill.on-the-way{background:var(--obg);color:var(--o)}
.pill.delivered,.pill.paid,.pill.success,.pill.approved,.pill.resolved{background:var(--gbg);color:var(--g)}.pill.cancelled,.pill.refunded,.pill.hidden{background:var(--s3);color:var(--dim)}
.pill.clarify,.pill.hold,.pill.failed-delivery,.pill.refund-review,.pill.unpaid,.pill.open,.pill.pending,.pill.abandoned{background:var(--rbg);color:var(--r)}.pill.in-progress,.pill.waiting{background:var(--bbg);color:var(--b)}
.empty{border:1px dashed var(--line2);border-radius:var(--rad);padding:34px 16px;text-align:center;color:var(--mute)}

.dv{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overscroll-behavior:contain}

.dgrid{display:grid;gap:12px;margin-top:14px}@media(min-width:900px){.dgrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.cust{display:grid;gap:4px}.cust b{font-size:19px}.cust a{font-size:15px}.cust .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.pics small{display:block;padding:7px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rows{display:grid}.rows>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.rows>div:last-child{border:0}
.rows>div>span{flex:1}.rows>div>b{flex:none;text-align:right}.rows small{color:var(--mute);font-family:var(--mono);font-size:10.5px}
.sgl{display:flex;gap:10px;align-items:center}.sgl img{width:52px;height:52px;object-fit:contain;background:var(--s3);border-radius:8px;padding:3px;display:block;flex:none}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}.flow button{min-height:44px;padding:6px 10px;border:1px solid var(--line2);border-radius:var(--rad2);font-size:13px;line-height:1.25;text-align:left;background:var(--s1)}
.flow button.on{background:var(--fg);color:#000;border-color:var(--fg)}.flow button.done{border-color:rgba(34,197,94,.45);color:#bbf7d0}.flow.exc button{border-style:dashed}.flow.exc button.on{background:var(--r);border-color:var(--r);color:#000}
.hist{display:grid;gap:0;font-size:13.5px}.hist div{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:0 0 12px;position:relative}.hist div:before{content:'';width:9px;height:9px;border-radius:50%;background:var(--line2);margin-top:6px}
.hist div:not(:last-child):after{content:'';position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line)}.hist small{display:block;color:var(--mute)}
.payst{display:flex;gap:12px;align-items:flex-start}.payst .big{font-size:26px;font-weight:600;letter-spacing:-.02em}

.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line2);border-radius:var(--rad2);text-decoration:none;font-size:14px;margin-top:8px;padding:0 14px;background:var(--s1)}
textarea.msg{min-height:96px;font:14px/1.5 Geist,sans-serif;resize:vertical}
.note{background:var(--s2);border-radius:var(--rad2);padding:10px 12px;margin-top:8px;font-size:14px}.note small{display:block;color:var(--mute);margin-top:4px}
.stars{color:var(--y);letter-spacing:2px}
/* login */
.login{max-width:420px;margin:12vh auto 0;padding:0 var(--gut);display:grid;gap:12px}.login input{min-height:54px;background:var(--s1);border:1px solid var(--line2);border-radius:var(--rad2);padding:0 16px;font-size:17px;outline:none}
.login button{min-height:54px;background:var(--fg);color:#000;font-weight:600;border-radius:var(--rad2)}.err{color:var(--r);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:#000;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:999px;z-index:90;max-width:calc(100% - 32px);text-align:center}
/* payments + reviews + support cards */
.pay{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:grid;gap:6px}.pay .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pay .ph b{font-size:22px;font-weight:600}
.pay p{font-size:14px;color:#d4d4d8}.pit{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}.pit ul{margin:6px 0 0;padding-left:18px;color:#c9c9cf}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.pbar label{display:flex;gap:6px;align-items:center}
.rvph{width:100%;max-height:260px;object-fit:cover;border-radius:var(--rad2);display:block}
/* notifications switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}.sw b{display:block;color:#fff;font-size:15px}.sw small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.tg{flex:none;width:52px;height:30px;border-radius:15px;background:#3f3f46;position:relative;transition:background .2s}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--g)}.tg.on i{transform:translateX(22px)}.lnk2{margin-top:10px;font-size:13px;color:#bbb;text-decoration:underline}

.add{background:var(--s1);border:1px solid var(--line2);border-radius:var(--rad);padding:16px;display:grid;gap:12px;margin-top:16px}.ah{font-weight:600;display:flex;gap:10px;align-items:center}.ah b{width:24px;height:24px;flex:none;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:13px}
.pick{display:grid;gap:4px;place-items:center;text-align:center;border:1px dashed var(--line2);border-radius:var(--rad2);padding:22px 12px;cursor:pointer}.pick input{display:none}.pick span{font-weight:600}

.stg,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.stg:empty{display:none}
.sti{position:relative;background:var(--s3);border-radius:var(--rad2);aspect-ratio:1;display:grid;place-items:center;padding:6px}.sti img{max-width:100%;max-height:100%;display:block}.sti button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);font-size:11px}
.sti small{position:absolute;left:5px;bottom:3px;font-family:var(--mono);font-size:9px;color:#888}
.np{display:grid;gap:8px}.np input{min-height:46px;background:var(--s1);border:1px solid var(--line2);border-radius:var(--rad2);color:#fff;padding:0 12px;font-size:15px;width:100%}.np input[type=color]{width:48px;min-height:32px;height:32px;padding:0;border:0}
.go{min-height:52px;background:var(--fg);color:#000;font-weight:600;border-radius:var(--rad2)}.go:disabled{opacity:.4}
.pkx{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:12px;display:grid;gap:10px}.pkh{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:start}.pkh img{width:90px;display:block;border-radius:8px}.pkh b{display:block;font-size:17px}.row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.fl2{display:grid;gap:4px}.fl2 .inp,.fl2 select{min-height:44px}

.qbig b{font-size:24px;font-weight:600;letter-spacing:-.02em}.qbig>div:first-child b{color:var(--y);font-size:30px}.qbig b.dim{color:#a1a1aa}.qbig b.g{color:var(--g)}.qbig small{color:var(--mute);font-size:12px}
.tblw{overflow-x:auto;margin:0 calc(-1*16px);padding:0 16px}.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;padding:8px 8px 8px 0;border-bottom:1px solid var(--line2)}

.chips{display:flex;gap:5px;flex-wrap:wrap}

.chip b{font-weight:600;color:#fff}.chip.A5{background:var(--bbg);color:var(--b)}.chip.A4{background:var(--pbg);color:var(--p)}.chip.A3{background:var(--obg);color:var(--o)}.chip.XL{background:var(--ybg);color:var(--y)}

.wait{opacity:.6}.banner{border-radius:var(--rad);padding:12px 14px;margin-top:12px;font-size:14px}.banner.r{background:var(--rbg);color:#fecaca}.banner.g{background:var(--gbg);color:#bbf7d0}

<div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
// Skin Lab print queue: every order's print job, without prices, payments or phone numbers (the server strips them).
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } };
const KEY = () => ls('sl-print'), ME = () => ls('sl-print-name') || 'Printer';
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); };
const when = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const ST = { new: 'New', confirmed: 'Paid, to print', artwork: 'Artwork', printing: 'Printing', qc: 'Quality check', ready: 'Ready', 'on-the-way': 'Out for delivery', delivered: 'Delivered', clarify: 'Needs clarification', hold: 'On hold', 'failed-delivery': 'Delivery failed', cancelled: 'Cancelled', 'refund-review': 'Refund', refunded: 'Refunded' };
const STEPS = [['artwork', 'Preparing artwork'], ['printing', 'Printing'], ['qc', 'Quality check'], ['ready', 'Ready for pickup']];
const SKZ = { S: 'Small skin · up to 13.3″', M: 'Medium skin · 14–15.6″', L: 'Large skin · 16–17.3″', C: 'Custom skin / full wrap' };
const SHEET = { A5: '148 × 210 mm', A4: '210 × 297 mm', A3: '297 × 420 mm', XL: 'A4 sheet, one big sticker' };
let orders = [], tab = 'todo', FILES = { packs: {} }, timer = 0;
fetch('/print/files.json').then(r => r.json()).then(j => FILES = j).catch(() => {});

async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY(), 'x-admin-name': ME(), ...(opt.headers || {}) } });
  if (r.status === 401) throw Object.assign(new Error('Wrong password'), { code: 401 });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }
const post = (a, body) => api('/api/admin/', { method: 'POST', body: JSON.stringify({ a, ...body }) });

// one order -> the list of things to print
function jobs(o) {
  const out = [];
  for (const p of o.packs || []) {
    const k = p.key || '';
    if (/^dc~/.test(k)) { const [, id, c] = k.split('~'); out.push({ kind: 'decal', chip: 'Laptop Art', size: c === 'w' ? 'white vinyl' : 'black vinyl', q: p.q, title: p.label, img: `/decals/${id}-s.webp`, file: `/print/decals/${id}.png`, wide: 1, how: 'One-colour cut vinyl. Cut from the PNG outline, weed, transfer tape.' }); }
    else if (/^skin~/.test(k)) { const [, id, z] = k.split('~'); out.push({ kind: 'skin', chip: 'Skin ' + z, size: SKZ[z] || z, q: p.q, title: p.label, img: `/skins/${id}-s.webp`, file: `/print/skins/${id}.jpg`, wide: 1, how: 'Lid skin. Scale the master to the laptop, print on SAV, laminate, cut to the lid.' }); }
    else if (/^(kb|tp|ms)~/.test(k)) { const [t, id] = k.split('~'); out.push({ kind: 'skin', chip: t === 'kb' ? 'Keyboard' : 'Trackpad', size: t === 'kb' ? 'keyboard area + palm rest' : 'trackpad only (about 12 × 8 cm)', q: p.q, title: p.label, img: `/skins/${id}-s.webp`, file: `/print/skins/${id}.jpg`, wide: 1, how: t === 'kb' ? 'Cut around the keys and the trackpad. Model is in the order note.' : 'Small piece: gang it on another job\'s sheet. Round the corners.' }); }
    else { const [id, a5] = k.split('~'), size = a5 === '5' ? 'A5' : p.size || 'A4'; out.push({ kind: 'sheet', chip: size, size: SHEET[size] || size, q: p.q, title: p.label, n: p.n, img: `/sheets-xs/${a5 === '5' ? id + '-a5' : id}.webp`, file: FILES.packs[`${id}-${size}`] ? '/print/' + FILES.packs[`${id}-${size}`] : '', how: 'Print & cut on SAV, laminate, kiss-cut.' }); }
  }
  const pk = o.picks;
  if ((o.singles || []).length || pk) out.push({ kind: 'singles', chip: (pk && pk.size) || 'A5', size: SHEET[(pk && pk.size) || 'A5'], q: 1, title: `${(o.singles || []).reduce((a, s) => a + s.q, 0)} single stickers${o.free && !o.free.onDesign ? ' + free sticker' : ''}`, img: (pk && pk.sheet) || ((o.singles || [])[0] && ((o.singles[0].img) || `/hd/${o.singles[0].code}.avif`)), file: pk && pk.sheet, how: `Gang sheet laid out for you${pk && pk.scaled ? ' (scaled to fit A3)' : ', real size about 5.5 cm each'}. HD files of each sticker below.` });
  const d = o.design;
  if (d) {
    if (d.n) out.push({ kind: 'design', chip: d.size || 'A4', size: SHEET[d.size] || '', q: 1, title: `${d.packName || 'Custom pack'} · ${d.n} stickers`, img: d.sheet, file: d.sheet, how: 'The customer\'s own sheet from the designer.' });
    const k = d.raw && d.raw.k || {};
    for (const [part, id] of Object.entries(k)) if (id && /^ph-/.test(id)) out.push({ kind: 'skin', chip: part === 'pad' ? 'Trackpad' : part === 'kb' ? 'Keyboard' : part === 'bot' ? 'Bottom' : 'Skin ' + (d.skinSize || 'M'), size: part === 'pad' ? 'trackpad only' : `${{ lid: 'lid', kb: 'keyboard area', bot: 'bottom' }[part]} · ${SKZ[d.skinSize] || ''}`, q: 1, title: `${d.laptop || 'Laptop'} · ${part === 'pad' ? 'trackpad' : part} skin`, img: `/skins/${id}-s.webp`, file: `/print/skins/${id}.jpg`, wide: 1, how: 'See the laptop mock-up for placement.' });
      else if (id && /^s-/.test(id)) out.push({ kind: 'skin', chip: part === 'pad' ? 'Trackpad' : 'Skin', size: 'solid colour', q: 1, title: `${d.laptop || 'Laptop'} · ${part} · solid colour (${id.slice(2)})`, img: d.mock, wide: 1, how: 'Plain coloured vinyl.' });
  }
  return out;
}
const chipsOf = o => { const c = {}; jobs(o).forEach(j => c[j.chip] = (c[j.chip] || 0) + j.q); return Object.entries(c).map(([k, n]) => `<span class="chip ${/^Skin|Keyboard|Trackpad|Bottom/.test(k) ? 'skin' : k === 'Laptop Art' ? 'decal' : k}"><b>${n}×</b>${esc(k)}</span>`).join(''); };
const stage = o => ['cancelled', 'refunded', 'refund-review'].includes(o.status) ? 'x' : !o.paidOk ? 'wait' : ['new', 'confirmed', 'artwork', 'clarify', 'hold'].includes(o.status) ? 'todo' : o.status === 'printing' ? 'printing' : ['qc', 'ready'].includes(o.status) ? 'ready' : 'done';
const TABS = [['todo', 'To print'], ['printing', 'Printing'], ['ready', 'QC & ready'], ['wait', 'Not paid yet'], ['done', 'Sent out']];

function login(msg) {
  clearInterval(timer);
  app.innerHTML = `<div class="login"><span class="lbl">Skin Lab · print queue</span><h1>What to <em>print.</em></h1>
    <input id="pw" type="password" placeholder="Printer password" autocomplete="current-password" aria-label="Password">
    <input id="nm" placeholder="Your name" autocomplete="name" aria-label="Your name" value="${esc(ls('sl-print-name'))}">
    <button id="go">Open the queue</button><p class="err" id="er" role="alert">${esc(msg || '')}</p></div>`;
  const go = async () => { ls('sl-print', $('#pw').value.trim()); if ($('#nm').value.trim()) ls('sl-print-name', $('#nm').value.trim().slice(0, 30)); $('#go').textContent = 'Opening…'; await load(true); };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pw').focus();
}
async function load(first) {
  try { const j = await api('/api/admin/?a=orders'), before = new Set(orders.map(o => o.id));
    orders = j.orders.map(o => ({ ...o, paidOk: o.paidOk ?? (!!o.paid || o.total === 0), name: (o.name || '').split(' ')[0] })).filter(o => stage(o) !== 'x').sort((a, b) => a.at - b.at);
    const fresh = orders.filter(o => !before.has(o.id) && before.size && stage(o) === 'todo'); if (fresh.length) toast(`${fresh.length} new job${fresh.length > 1 ? 's' : ''} to print`);
    if (first) { clearInterval(timer); timer = setInterval(() => load(), 30000); const h = location.hash.slice(1); list(); if (/^SL-/.test(h)) open(h); }
    else if (!$('.dv')) list();
  } catch (e) { if (e.code === 401) { ls('sl-print', null); login('Wrong password'); } else if (first) login(e.message); }
}
function list() {
  const n = k => orders.filter(o => stage(o) === k).length, shown = orders.filter(o => stage(o) === tab);
  if (tab === 'done') shown.reverse();
  const todo = orders.filter(o => stage(o) === 'todo'), cnt = {}; todo.forEach(o => jobs(o).forEach(j => cnt[j.chip] = (cnt[j.chip] || 0) + j.q));
  app.innerHTML = `<header class="top"><div class="row"><b class="brand">Skin Lab<span>print queue</span></b><div class="me"><span class="who">${esc(ME())}</span><button class="ib" id="lo">Log out</button></div></div></header>
  <div class="w"><span class="lbl">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span><h1>${n('todo') ? `${n('todo')} to <em>print.</em>` : 'All <em>caught up.</em>'}</h1>
    ${todo.length ? `<div class="sumbox">${Object.entries(cnt).map(([k, v]) => `<div><b>${v}</b><small>${esc(k)}${SHEET[k] ? ' sheet' : ''}</small></div>`).join('')}</div>` : ''}
    <div class="tabs" id="tabs">${TABS.map(([k, t]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${t}<i>${n(k)}</i></button>`).join('')}</div>
    ${tab === 'wait' ? '<p class="alert">These orders are not paid yet. <b>Don\'t print them</b>; they move to “To print” on their own once Paystack confirms payment.</p>' : ''}
    <div class="list">${shown.map(o => { const j = jobs(o), im = (j.find(x => x.img) || {}).img;
      return `<button class="card ${stage(o) === 'wait' ? 'wait' : ''}" data-id="${o.id}"><span class="pic" style="${im ? `background-image:url('${esc(im)}')` : ''}">${im ? '' : 'no pic'}</span>
        <span class="body"><span class="meta"><b class="nm">${esc(o.id)} · ${esc(o.name)}</b><span class="pill ${o.status}">${ST[o.status] || o.status}</span></span>
        <p>${ago(o.at)}${o.note ? ' · 📝 note' : ''}</p><span class="chips" style="margin-top:6px">${chipsOf(o)}</span></span></button>`; }).join('') || `<div class="empty">Nothing here.</div>`}</div>
    <div class="panel" id="nt" style="margin-top:22px"></div>
    <p class="lbl" style="margin-top:18px">All print files: <a href="/print/" target="_blank" rel="noopener" style="color:#fff">shop.baidencreatives.org/print</a></p></div>`;
  $('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; list(); } };
  app.querySelector('.list').onclick = e => { const c = e.target.closest('[data-id]'); if (c) open(c.dataset.id); };
  $('#lo').onclick = () => { if (confirm('Log out of the print queue?')) { ls('sl-print', null); login(); } };
  notifCard();
}
function open(id) {
  const o = orders.find(x => x.id === id); if (!o) return toast('That order is not in the queue');
  history.replaceState(null, '', '#' + id); const js = jobs(o), at = STEPS.findIndex(s => s[0] === o.status), paid = o.paidOk;
  const v = document.createElement('div'); v.className = 'dv'; document.body.style.overflow = 'hidden';
  const singles = (o.singles || []).map(s => ({ ...s, img: s.img || `/hd/${s.code}.avif` }));
  v.innerHTML = `<div class="dhead"><button class="ib" id="bk">← Queue</button><span class="pill ${o.status}">${ST[o.status] || o.status}</span></div>
  <div class="w"><span class="lbl">${esc(o.id)} · ordered ${when(o.at)}</span><h1>${esc(o.name)}<em>’s job.</em></h1><div class="chips" style="margin-top:8px">${chipsOf(o)}</div>
    ${paid ? '' : '<div class="banner r"><b>Not paid yet.</b> Don\'t print this one. It moves to “To print” by itself once the payment is confirmed.</div>'}
    ${o.note ? `<div class="banner g"><b>Customer note:</b> ${esc(o.note)}</div>` : ''}
    <div class="dgrid"><div>
      <div class="panel"><h2>Print list</h2>${js.map(j => `<div class="job"><a class="im ${j.wide ? 'wide' : ''}" ${j.file ? `href="${esc(j.file)}" target="_blank" rel="noopener"` : ''} style="${j.img ? `background-image:url('${esc(j.img)}')` : ''}" aria-label="Open the file"></a>
        <div><b class="t">${j.q > 1 ? `<span style="color:var(--y)">${j.q}×</span> ` : ''}${esc(j.title)}</b><div class="chips" style="margin-top:6px"><span class="chip ${/^A|XL/.test(j.chip) ? j.chip : j.kind === 'decal' ? 'decal' : 'skin'}">${esc(j.chip)}</span><span class="chip">${esc(j.size || '')}</span>${j.n ? `<span class="chip">${j.n} stickers</span>` : ''}</div>
        <p>${esc(j.how)}</p><div class="acts">${j.file ? `<a class="ib solid" href="${esc(j.file)}" download target="_blank" rel="noopener">↓ Print file</a>` : (j.kind === 'singles' ? '<span class="lbl">HD file of each sticker below</span>' : '<span class="lbl">File: on the print files page</span>')}</div></div></div>`).join('')}</div>
      ${singles.length ? `<div class="panel"><h2>Single stickers · HD files</h2><div class="codes">${singles.map(s => `<a href="${esc(s.img)}" target="_blank" rel="noopener" download><img src="${esc(s.img)}" alt="" loading="lazy"><small>${esc(s.code)}</small>${s.q > 1 ? `<i>× ${s.q}</i>` : ''}</a>`).join('')}</div></div>` : ''}
      ${o.free ? `<div class="panel"><h2>Free sticker</h2><div class="codes"><a href="${esc(o.free.img || `/free/${o.free.code}.webp`)}" target="_blank" rel="noopener"><img src="${esc(o.free.img || `/free/${o.free.code}.webp`)}" alt=""><small>${esc(o.free.code)}</small></a></div><p class="lbl" style="margin-top:8px">${o.free.onDesign ? 'Already on their laptop design sheet' : 'Add it to this order\'s sheet'}</p></div>` : ''}
      ${o.design && o.design.mock ? `<div class="panel"><h2>Their laptop design</h2><div class="pics"><a href="${esc(o.design.mock)}" target="_blank" rel="noopener"><img src="${esc(o.design.mock)}" alt=""><small>${esc(o.design.laptop || '')}</small></a></div></div>` : ''}
    </div><div>
      <div class="panel"><h2>Where it is</h2>
        <div class="big-step">${STEPS.map(([s, t], i) => `<button class="ib ${s === o.status ? 'solid' : ''}" data-s="${s}" ${paid ? '' : 'disabled'}>${i < at ? '✓ ' : ''}${t}</button>`).join('')}</div>
        <div class="big-step"><button class="ib warn" data-s="clarify" ${paid ? '' : 'disabled'}>Need to ask something</button><button class="ib warn" data-s="hold" ${paid ? '' : 'disabled'}>Put on hold</button></div>
        <p class="lbl" style="margin-top:10px">The customer sees each step on their order page.</p></div>
      <div class="panel"><h2>Notes for the team</h2>${(o.notes || []).map(n => `<div class="note">${esc(n.t)}<small>${esc(n.by)} · ${when(n.at)}</small></div>`).join('') || '<p class="lbl">No notes yet</p>'}
        <textarea class="msg" id="nn" placeholder="e.g. Out of clear vinyl, printing tomorrow" style="margin-top:10px"></textarea><button class="btn" id="nns">Add note</button></div>
      <div class="panel"><h2>History</h2><div class="hist">${(o.history || []).map(h => `<div><span>${esc(ST[h.s] || h.s)}<small>${when(h.at)}${h.by ? ' · ' + esc(h.by) : ''}</small></span></div>`).join('')}</div></div>
    </div></div></div>`;
  document.body.appendChild(v);
  const close = () => { v.remove(); document.body.style.overflow = ''; history.replaceState(null, '', location.pathname); list(); };
  const upd = r => { const i = orders.findIndex(x => x.id === o.id); orders[i] = r.order; v.remove(); document.body.style.overflow = ''; open(o.id); };
  $('#bk').onclick = close; v.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  v.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => { b.disabled = true; try { upd(await post('status', { id: o.id, status: b.dataset.s })); toast(ST[b.dataset.s] + ' ✓'); } catch (e) { toast(e.message); b.disabled = false; } });
  $('#nns').onclick = async () => { const t = $('#nn').value.trim(); if (!t) return; try { upd(await post('note', { id: o.id, note: t })); toast('Note added'); } catch (e) { toast(e.message); } };
}

// ---------- phone notifications: a ping when an order is paid and ready to print ----------
let swReg = null; if ('serviceWorker' in navigator) navigator.serviceWorker.register('/printer/sw.js', { scope: '/printer/' }).then(r => swReg = r).catch(() => {});
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function notifCard() { const el = $('#nt'); if (!el) return;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { el.innerHTML = '<b>Notifications:</b> on iPhone, add this page to your Home Screen first (Share ⬆︎ → Add to Home Screen), then open it from there.'; return; }
  if (Notification.permission === 'denied') { el.innerHTML = '<b>Notifications are blocked</b> for this site in your browser settings.'; return; }
  const r = swReg || await navigator.serviceWorker.ready, sub = await r.pushManager.getSubscription(), on = !!sub;
  el.innerHTML = `<div class="sw"><span><b>New job alerts</b><small>${on ? 'On · you get a ping when an order is paid and ready to print' : 'Off · turn on to get a ping for every paid order'}</small></span><button class="tg ${on ? 'on' : ''}" id="tg" role="switch" aria-checked="${on}" aria-label="New job alerts"><i></i></button></div>`;
  $('#tg').onclick = async () => { try {
    if (on) { await api('/api/subscribe/', { method: 'DELETE', body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); toast('Alerts off'); }
    else { if (await Notification.requestPermission() !== 'granted') return notifCard(); const { publicKey } = await api('/api/subscribe/'), s = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
      await api('/api/subscribe/', { method: 'POST', body: JSON.stringify({ sub: s }) }); post('push-test', {}).catch(() => {}); toast('Alerts on'); }
  } catch (e) { toast(e.message || 'Could not change it'); } notifCard(); };
}
if (KEY()) { app.innerHTML = '<div class="login"><span class="lbl">Opening the print queue…</span></div>'; load(true); } else login();
</script></body></html>
