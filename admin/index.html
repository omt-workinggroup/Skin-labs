<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--fg:#fff;--mute:#8c8c8c;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.28);--g:#1faa53;--gut:max(16px,env(safe-area-inset-left,0px));--serif:'Instrument Serif',Georgia,serif;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}

button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}a{color:inherit}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;padding:0 var(--gut);background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top b{font-weight:700;font-size:19px;letter-spacing:-.045em}.top .r{display:flex;gap:6px;align-items:center}
.ib{height:36px;padding:0 12px;border:1px solid var(--line2);font-size:13px}
.w{max-width:980px;margin:0 auto;padding:16px var(--gut) 80px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,10vw,64px);line-height:.95;margin:10px 0 4px}h1 em{font-style:italic}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0 14px}
.stats div{background:#000;padding:12px}.stats b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gut));padding:0 var(--gut)}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 14px;border:1px solid var(--line);font-size:13px;color:#ccc}.tabs .on{background:#fff;color:#000;border-color:#fff}
.tabs i{font-style:normal;font-family:var(--mono);font-size:10px;opacity:.6;margin-left:5px}
.srch{width:100%;height:46px;background:none;border:1px solid var(--line2);padding:0 14px;margin:10px 0 6px;outline:none;font-size:16px}
.alert{border:1px solid var(--line2);padding:12px 14px;margin:14px 0 0;font-size:13.5px;color:#ccc}.alert:empty{display:none}.alert .btn{width:100%;margin-top:10px}.alert b{color:#fff}
.list{display:grid;gap:10px;margin-top:12px}
.card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;text-align:left;border:1px solid var(--line);padding:10px;width:100%;position:relative}
.card.new{border-color:#fff}.card .pic{width:84px;height:110px;background:#151515 center/cover;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:#666}
.card b{font-size:16px;font-weight:600}.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card p{color:#aaa;font-size:13px;margin-top:2px}.card .tot{font-weight:600;font-size:16px;margin-top:6px}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line2);white-space:nowrap}
.pill.new{background:#fff;color:#000;border-color:#fff}.pill.confirmed{border-color:#4cc2ff;color:#4cc2ff}.pill.printing{border-color:#ffd21f;color:#ffd21f}.pill.on-the-way{border-color:#ff9f43;color:#ff9f43}.pill.delivered{border-color:var(--g);color:var(--g)}.pill.cancelled{color:#777}
.empty{border:1px dashed var(--line2);padding:30px 16px;text-align:center;color:#aaa}
/* detail */
.dv{position:fixed;inset:0;z-index:50;background:#000;overflow:auto;padding:0 0 60px}
.dv .w{padding-top:0}.dhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 var(--gut);background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:16px 0}.pics a{display:block;background:#151515}.pics img{width:100%;display:block}
.pics small{display:block;padding:6px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#aaa}
.cust{display:grid;gap:4px;border:1px solid var(--line);padding:14px}.cust b{font-size:20px}.cust a{font-size:16px}
.sec{margin-top:18px}.sec h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-bottom:8px}
.rows{border-top:1px solid var(--line)}.rows div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.rows small{color:#999;font-family:var(--mono);font-size:11px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.st button{height:44px;border:1px solid var(--line2);font-size:13px}.st button.on{background:#fff;color:#000;border-color:#fff}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;background:var(--g);color:#fff;font-weight:600;text-decoration:none;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border:1px solid var(--line2);text-decoration:none;font-size:14px;margin-top:8px}
.msg{width:100%;min-height:96px;background:#0d0d0d;border:1px solid var(--line2);padding:12px;font:14px/1.45 Geist,sans-serif;color:#fff;resize:vertical}
.login{max-width:420px;margin:12vh auto 0;padding:0 var(--gut);display:grid;gap:12px}.login input{height:54px;background:none;border:1px solid var(--line2);padding:0 16px;font-size:17px;outline:none}
.login button{height:54px;background:#fff;color:#000;font-weight:600}.err{color:#ff6b6b;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;z-index:90}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.pay{border:1px solid var(--line);padding:14px;margin-bottom:10px}.pay .ph{display:flex;justify-content:space-between;align-items:center}.pay .ph b{font-size:24px;font-weight:600}.pay p{margin:4px 0;font-size:14px}.pit{margin-top:10px;padding-top:10px;border-top:1px solid #1c1c1c;font-size:14px}.pit ul{margin:6px 0 0;padding-left:18px;color:#ccc}.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pact .ib,.pbar .ib{height:38px;padding:0 14px;border:1px solid var(--line);background:#000;color:#fff;width:auto}.pact .warn{border-color:#ffd400;color:#ffd400}.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.pbar label{display:flex;gap:6px;align-items:center}.pd{color:#1faa53;font-weight:700}.pd.short{color:#ff8a7a}.sales{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 14px}.sales>div{background:#000;padding:12px}.sales b{display:block;font-size:22px;font-weight:600}.sales small{color:#999;font-size:12px}
.sales .top{grid-column:1/-1}.sales .top p{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid #161616}.sales .ib{grid-column:1/-1;height:44px;background:#000;border:0}
.sgl{display:flex;gap:12px;align-items:center}.sgl img{width:56px;height:56px;object-fit:contain;background:#1a1a1a;padding:3px;display:block}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}.sw b{display:block;color:#fff;font-size:15px}.sw small{display:block;color:#999;font-size:12.5px;margin-top:2px}
.tg{flex:none;width:58px;height:34px;border-radius:17px;background:#333;position:relative;transition:background .2s}.tg i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:#1faa53}.tg.on i{transform:translateX(24px)}.lnk2{margin-top:10px;font-size:13px;color:#bbb;text-decoration:underline}
.nav{display:flex;border:1px solid var(--line2)}.nav button{height:36px;padding:0 12px;font-size:13px;color:#bbb;position:relative}.nav button.on{background:#fff;color:#000}.nav i{font-style:normal;font-size:10px;background:#1faa53;color:#fff;border-radius:9px;padding:1px 6px;margin-left:6px}
.add{border:1px solid var(--line2);padding:16px;display:grid;gap:12px;margin-top:16px}.ah{font-weight:600;display:flex;gap:10px;align-items:center}.ah b{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:13px}
.pick{display:grid;gap:4px;place-items:center;text-align:center;border:1px dashed var(--line2);padding:22px 12px;cursor:pointer}.pick input{display:none}.pick span{font-weight:600}
.ck{display:flex;gap:10px;align-items:center;font-size:14px;color:#ddd}.ck input[type=checkbox]{width:20px;height:20px}
.stg,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.stg:empty{display:none}
.sti{position:relative;background:#1a1a1a;aspect-ratio:1;display:grid;place-items:center;padding:6px}.sti img{max-width:100%;max-height:100%;display:block}.sti button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);font-size:11px}
.sti small{position:absolute;left:4px;bottom:2px;font-family:var(--mono);font-size:9px;color:#888}
select,.np input{height:48px;background:#000;border:1px solid var(--line2);color:#fff;padding:0 12px;font-size:15px;width:100%}.np{display:grid;gap:8px}.np input[type=color]{width:48px;height:32px;padding:0;border:0}
.go{height:52px;background:#fff;color:#000;font-weight:600}.go:disabled{opacity:.4}
.pkx{border:1px solid var(--line);padding:12px;margin-bottom:12px;display:grid;gap:10px}.pkh{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}.pkh img{width:90px;display:block}.pkh b{display:block;font-size:17px}.row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
</style></head><body>
<div id="app"></div><div class="toast" id="toast" hidden></div>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); };
const KEY = () => { try { return localStorage.getItem('sl-admin') || ''; } catch (e) { return ''; } };
const ST = { new: 'New', confirmed: 'Confirmed', printing: 'Printing', 'on-the-way': 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' };
const ACTIVE = ['confirmed', 'printing', 'on-the-way'];
let view = 'orders', orders = [], filter = 'new', q = '', alerts = 'off', seen = new Set(JSON.parse(localStorage.getItem('sl-admin-seen') || '[]')), timer = 0;
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const moneyTxt = o => (o.skinOnDM ? (o.total > 0 ? `₵${o.total} + skin (price on DM)` : 'Skin · price on DM') : `₵${o.total}`) + (o.paid ? ` · <span class="pd ${o.paid.short ? 'short' : ''}">${o.paid.short ? `⚠ paid ₵${o.paid.amount}` : '✓ PAID'}</span>` : '');
const first = n => (n || '').split(' ')[0];
const what = o => [o.design ? `${o.design.packName || 'Custom pack'} (${o.design.size || '–'}, ${o.design.n} stickers)` : '', ...(o.packs || []).map(p => `${p.q}× ${p.label}`), (o.singles || []).length ? `${o.singles.reduce((a, s) => a + s.q, 0)} singles` : ''].filter(Boolean).join(' · ');
async function api(path, opt = {}) { const r = await fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY(), ...(opt.headers || {}) } }); if (r.status === 401) throw Object.assign(new Error('Wrong password'), { code: 401 }); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Error'); return j; }

function login(msg) {
  clearInterval(timer);
  app.innerHTML = `<div class="login"><span class="lbl">Skin Lab · admin</span><h1>Your <em>orders.</em></h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Open</button><p class="err" id="er">${esc(msg || '')}</p></div>`;
  const go = async () => { try { localStorage.setItem('sl-admin', $('#pw').value.trim()); } catch (e) {} $('#go').textContent = 'Opening…'; await load(true); };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pw').focus();
}
async function load(first) {
  try { const j = await api('/api/orders/'); const before = new Set(orders.map(o => o.id)); orders = j.orders; alerts = j.alerts;
    const fresh = orders.filter(o => o.status === 'new' && !before.has(o.id) && before.size);
    if (fresh.length) { ding(); toast(`${fresh.length} new order${fresh.length > 1 ? 's' : ''}`); }
    if (first) { const h = decodeURIComponent(location.hash.slice(1)); if (h === 'stickers') stickers(); else if (h === 'payments') payments(); else list(); clearInterval(timer); timer = setInterval(() => load(), 20000); if (h && h !== 'stickers' && h !== 'payments') open(h); } else if (view === 'orders' && !$('.dv')) list(); else badge();
  } catch (e) { if (e.code === 401) { try { localStorage.removeItem('sl-admin'); } catch (x) {} login('Wrong password'); } else if (first) login(e.message); }
}
function ding() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch (e) {} try { navigator.vibrate && navigator.vibrate([80, 60, 80]); } catch (e) {} }
function badge() { const n = orders.filter(o => o.status === 'new').length; document.title = (n ? `(${n}) ` : '') + 'Orders · Skin Lab admin'; }
function list() {
  badge(); const cnt = { new: 0, active: 0, done: 0, all: orders.length }; orders.forEach(o => { if (o.status === 'new') cnt.new++; else if (ACTIVE.includes(o.status)) cnt.active++; else cnt.done++; });
  const today = orders.filter(o => Date.now() - o.at < 864e5), money = orders.filter(o => o.status !== 'cancelled').reduce((a, o) => a + (o.total || 0), 0);
  const show = orders.filter(o => (filter === 'all' || (filter === 'new' ? o.status === 'new' : filter === 'active' ? ACTIVE.includes(o.status) : !ACTIVE.includes(o.status) && o.status !== 'new'))
    && (!q || `${o.id} ${o.name} ${o.phone} ${o.loc}`.toLowerCase().includes(q.toLowerCase())));
  view = 'orders'; app.innerHTML = `${topbar('orders')}
  <div class="w"><span class="lbl">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span><h1>Orders<em>.</em></h1>
    <div class="alert" id="nt"></div>
    <div class="stats"><div><b>${cnt.new}</b><span class="lbl">New</span></div><div><b>${cnt.active}</b><span class="lbl">In progress</span></div><div><b>${today.length}</b><span class="lbl">Today</span></div><div><b>₵${money}</b><span class="lbl">All time</span></div></div>
    ${(() => { const ok = orders.filter(o => o.status !== 'cancelled'), wk = ok.filter(o => Date.now() - o.at < 7 * 864e5), mo = ok.filter(o => new Date(o.at).getMonth() === new Date().getMonth() && new Date(o.at).getFullYear() === new Date().getFullYear());
      const cnt = {}; ok.forEach(o => { (o.packs || []).forEach(p => cnt[p.label.split(' · ')[0]] = (cnt[p.label.split(' · ')[0]] || 0) + p.q); if (o.design) cnt['Custom laptop packs'] = (cnt['Custom laptop packs'] || 0) + 1; const s = (o.singles || []).reduce((a, x) => a + x.q, 0); if (s) cnt['Single stickers'] = (cnt['Single stickers'] || 0) + s; });
      const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 5);
      return `<div class="sales"><div><span class="lbl">This week</span><b>₵${wk.reduce((a, o) => a + o.total, 0)}</b><small>${wk.length} orders</small></div><div><span class="lbl">This month</span><b>₵${mo.reduce((a, o) => a + o.total, 0)}</b><small>${mo.length} orders</small></div>
        <div class="top"><span class="lbl">Best sellers</span>${top.length ? top.map(([n, q]) => `<p><span>${esc(n)}</span><b>${q}</b></p>`).join('') : '<p><span>No sales yet</span></p>'}</div><button class="ib" id="csv">Download orders (CSV)</button></div>`; })()}
    <div class="tabs" id="tabs">${[['new', 'New', cnt.new], ['active', 'In progress', cnt.active], ['done', 'Done', cnt.done], ['all', 'All', cnt.all]].map(([k, n, c]) => `<button class="${k === filter ? 'on' : ''}" data-f="${k}">${n}<i>${c}</i></button>`).join('')}</div>
    <input class="srch" id="q" placeholder="Search name, number, order…" value="${esc(q)}">
    <div class="list">${show.length ? show.map(o => { const pic = o.design && (o.design.sheet || o.design.mock);
      const pp = !pic && !(o.picks && o.picks.sheet) && (o.packs || [])[0], img = pic || (o.picks && o.picks.sheet) || (pp ? `/sheets-xs/${pp.key.replace('~5', '-a5')}.webp` : '');
      return `<button class="card ${o.status === 'new' ? 'new' : ''}" data-id="${o.id}"><span class="pic" ${img ? `style="background-image:url('${esc(img)}')"` : ''}>${img ? '' : 'SINGLES'}</span>
        <span><span class="meta"><span><b>${esc(o.name)}</b><p>${esc(o.id)} · ${ago(o.at)}</p></span><span class="pill ${o.status}">${ST[o.status]}</span></span>
        <p>${esc(what(o))}</p><p>${esc(o.loc || '')}</p><div class="tot">${moneyTxt(o)}</div></span></button>`; }).join('')
      : `<div class="empty">${orders.length ? 'Nothing here.' : 'No orders yet. They land here the moment a customer taps “Place order”.'}</div>`}</div>
  </div>`;
  notifCard();
  $('#csv').onclick = () => { const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, rows = [['Order', 'Date', 'Status', 'Name', 'WhatsApp', 'Location', 'Items', 'Free sticker', 'Total GHS', 'Paid GHS', 'Paystack ref']];
    orders.forEach(o => rows.push([o.id, new Date(o.at).toISOString().slice(0, 16).replace('T', ' '), ST[o.status], o.name, '+' + o.phone, o.loc, what(o), o.free ? o.free.code : '', o.total, o.paid ? o.paid.amount : '', o.paid ? o.paid.ref : '']));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = `skin-lab-orders-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); toast('Downloaded'); };
  $('#tabs').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; list(); } };
  $('#q').oninput = e => { q = e.target.value; const p = e.target.selectionStart; list(); const i = $('#q'); i.focus(); i.setSelectionRange(p, p); };
  wireTop();
  app.querySelectorAll('.card').forEach(c => c.onclick = () => open(c.dataset.id));
}
let PAYON = false; fetch('/api/pay/').then(r => r.json()).then(j => { PAYON = !!j.enabled; }).catch(() => {});
const MSG = {
  confirmed: o => `Hi ${first(o.name)}, it's Skin Lab 👋\nYour order ${o.id} is confirmed: ${what(o)}.\n${o.paid ? `Payment of GH₵${o.paid.amount} received ✓ We're printing it next.` : `Total: GH₵${o.total}.\n${PAYON ? `Pay here (MoMo or card): ${location.origin}/o/${o.id}/ , then we start printing.` : 'Please pay with MoMo and send the screenshot here, then we start printing.'}`}`,
  printing: o => `Hi ${first(o.name)}, your Skin Lab order ${o.id} is printing now 🖨️ We'll tell you when it's on the way.`,
  'on-the-way': o => `Hi ${first(o.name)}, your Skin Lab order ${o.id} is on the way 🚚 We'll call you when we're close${o.loc ? ' to ' + o.loc : ''}.`,
  delivered: o => `Hi ${first(o.name)}, enjoy your stickers! 🙌 Show us your laptop: tag @baidencreatives on Instagram. Thanks for ordering from Skin Lab.`,
  cancelled: o => `Hi ${first(o.name)}, about your Skin Lab order ${o.id}: `,
  new: o => `Hi ${first(o.name)}, thanks for your Skin Lab order ${o.id}! `,
};
function open(id) {
  const o = orders.find(x => x.id === id); if (!o) return; history.replaceState(null, '', '#' + id);
  if (!seen.has(id)) { seen.add(id); try { localStorage.setItem('sl-admin-seen', JSON.stringify([...seen].slice(-500))); } catch (e) {} }

  box.className = ''; box.innerHTML = `
    <div class="add"><div class="ah"><b>1</b> Pictures</div>
      <label class="pick"><input type="file" id="files" accept="image/*" multiple><span>Choose sticker pictures</span><small class="lbl">PNG with a clear background is best · screenshots and JPGs work too</small></label>
      <label class="ck"><input type="checkbox" id="cut" checked> Remove plain background</label><label class="ck"><input type="checkbox" id="ol" checked> Add the thin white sticker outline</label>
      <div class="stg" id="stg">${staged.map((x, i) => `<span class="sti"><img src="${x.prev}" alt=""><button data-x="${i}" aria-label="Remove">✕</button></span>`).join('')}</div>
      <div class="ah"><b>2</b> Pack</div>
      <select id="pk"><option value="">＋ New pack</option>${drops.map(p => `<option value="${p.id}">${esc(p.name)} · ${p.items.length} stickers</option>`).join('')}</select>
      <div id="np" class="np"><input id="pn" maxlength="40" placeholder="Pack name, e.g. Money Moves"><select id="pc">${CATS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select>
        <input id="pt" maxlength="60" placeholder="Short line, e.g. hustle, bag & no days off"><label class="ck">Sheet colour <input type="color" id="pb" value="#111111"></label></div>
      <button class="go" id="pub" ${staged.length ? '' : 'disabled'}>${staged.length ? `Publish ${staged.length} sticker${staged.length > 1 ? 's' : ''}` : 'Choose pictures first'}</button><p class="lbl" id="prog"></p></div>
    <div class="sec"><h3>Your packs · live in the shop</h3>${drops.length ? drops.map(p => `<div class="pkx"><div class="pkh">${p.sheet ? `<a href="${esc(p.sheet)}" target="_blank" rel="noopener"><img src="${esc(p.sheet)}" alt=""></a>` : ''}<span><b>${esc(p.name)}</b><span class="lbl">${esc((CATS.find(c => c[0] === p.cat) || ['', p.cat])[1])} · ${p.items.length} stickers · A5 ₵30 / A4 ₵60</span>
        <span class="row2"><button class="ib" data-sheet="${p.id}">Remake sheet</button><button class="ib" data-delp="${p.id}" style="color:#ff6b6b">Delete pack</button></span></span></div>
        <div class="grid">${p.items.map(s => `<span class="sti"><a href="${esc(s.url)}" target="_blank" rel="noopener"><img src="${esc(s.small)}" alt="${s.code}" loading="lazy"></a><small>${s.code}</small><button data-dels="${s.code}" aria-label="Delete ${s.code}">✕</button></span>`).join('')}</div></div>`).join('') : '<div class="empty">No packs yet. Add your first stickers above.</div>'}</div>`;
  const np = () => { $('#np').hidden = !!$('#pk').value; }; $('#pk').onchange = np; np();
  $('#files').onchange = async e => { const fs = [...e.target.files]; $('#prog').textContent = `Preparing ${fs.length} picture${fs.length > 1 ? 's' : ''}…`;
    for (const f of fs) { try { staged.push(await prep(f, $('#cut').checked, $('#ol').checked)); } catch (x) { toast(x.message); } }
    const keep = { pk: $('#pk').value, pn: $('#pn').value, pc: $('#pc').value, pt: $('#pt').value, pb: $('#pb').value }; drawStickers(); Object.entries(keep).forEach(([k, v]) => { $('#' + k).value = v; }); $('#np').hidden = !!keep.pk; };
  $('#stg').onclick = e => { const b = e.target.closest('[data-x]'); if (b) { staged.splice(+b.dataset.x, 1); drawStickers(); } };
  $('#pub').onclick = async () => { const pk = $('#pk').value, name = $('#pn').value.trim(); if (!pk && !name) return toast('Name the new pack');
    const btn = $('#pub'); btn.disabled = true; let packId = pk, pack = null;
    for (let i = 0; i < staged.length; i++) { $('#prog').textContent = `Uploading ${i + 1} of ${staged.length}…`; const s = staged[i];
      try { const r = await api('/api/catalog/', { method: 'POST', body: JSON.stringify({ action: 'add', packId, name, cat: $('#pc').value, tag: $('#pt').value, bg: $('#pb').value, img: s.img, small: s.small, w: s.w, h: s.h }) }); packId = r.pack.id; pack = r.pack; }
      catch (x) { toast(x.message); btn.disabled = false; $('#prog').textContent = `Stopped at ${i + 1}: ${x.message}`; staged = staged.slice(i); return; } }
    $('#prog').textContent = 'Making the pack sheet…';
    try { const sh = await makeSheet(pack); await api('/api/catalog/', { method: 'POST', body: JSON.stringify({ action: 'sheet', packId, img: sh.img, w: sh.w, h: sh.h }) }); } catch (x) { toast('Stickers are live; sheet failed: ' + x.message); }
    staged = []; toast('Live in the shop'); stickers(); };
  box.querySelectorAll('[data-dels]').forEach(b => b.onclick = async () => { if (!confirm(`Delete sticker ${b.dataset.dels}?`)) return; await api('/api/catalog/', { method: 'POST', body: JSON.stringify({ action: 'del-sticker', code: b.dataset.dels }) }); toast('Deleted'); stickers(); });
  box.querySelectorAll('[data-delp]').forEach(b => b.onclick = async () => { const p = drops.find(x => x.id === b.dataset.delp); if (!confirm(`Delete the whole pack “${p.name}” (${p.items.length} stickers)?`)) return; await api('/api/catalog/', { method: 'POST', body: JSON.stringify({ action: 'del-pack', packId: p.id }) }); toast('Pack deleted'); stickers(); });
  box.querySelectorAll('[data-sheet]').forEach(b => b.onclick = async () => { const p = drops.find(x => x.id === b.dataset.sheet); b.textContent = 'Making…'; try { const sh = await makeSheet(p); await api('/api/catalog/', { method: 'POST', body: JSON.stringify({ action: 'sheet', packId: p.id, img: sh.img, w: sh.w, h: sh.h }) }); toast('Sheet updated'); stickers(); } catch (x) { toast(x.message); b.textContent = 'Remake sheet'; } });
}

// ---------- phone notifications for new orders ----------
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let swReg = null; if ('serviceWorker' in navigator) navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).then(r => swReg = r).catch(() => {});
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function notifState() { if (!('serviceWorker' in navigator) || !('PushManager' in window)) return isIOS && !standalone ? 'ios-install' : 'unsupported';
  if (Notification.permission === 'denied') return 'denied'; const r = swReg || await navigator.serviceWorker.ready; const sub = await r.pushManager.getSubscription(); return sub ? 'on' : 'off'; }
async function notifCard() { const el = $('#nt'); if (!el) return; const st = await notifState().catch(() => 'unsupported');
  if (st === 'on' || st === 'off') {
    el.innerHTML = `<div class="sw"><span><b>Order notifications</b><small>${st === 'on' ? 'On for this phone · you get a ping for every new order, even with the app closed' : 'Off · turn on to get a ping for every new order'}</small></span>
      <button class="tg ${st === 'on' ? 'on' : ''}" id="tg" role="switch" aria-checked="${st === 'on'}" aria-label="Order notifications"><i></i></button></div>${st === 'on' ? '<button class="lnk2" id="ntt">Send a test notification</button>' : ''}`;
    $('#tg').onclick = async () => { const t = $('#tg'); t.disabled = true; t.classList.toggle('on');
      try { const r = swReg || await navigator.serviceWorker.ready;
        if (st === 'on') { const sub = await r.pushManager.getSubscription(); if (sub) { await api('/api/subscribe/', { method: 'DELETE', body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); } toast('Notifications off'); }
        else { const p = await Notification.requestPermission(); if (p !== 'granted') return notifCard();
          const { publicKey } = await api('/api/subscribe/'), sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
          await api('/api/subscribe/', { method: 'POST', body: JSON.stringify({ sub }) }); toast('Notifications on'); api('/api/push-test/', { method: 'POST', body: '{}' }).catch(() => {}); }
      } catch (e) { toast(e.message || 'Could not change it'); } notifCard(); };
    if ($('#ntt')) $('#ntt').onclick = async () => { const r = await api('/api/push-test/', { method: 'POST', body: '{}' }).catch(e => ({ result: e.message })); toast('Sent · ' + r.result); };
    return; }
  el.innerHTML = { 'ios-install': '<b>On iPhone, add this page to your Home Screen first:</b> tap Share ⬆︎ then “Add to Home Screen”, open “SL Orders” from your Home Screen, then switch notifications on here.',
    denied: '<b>Notifications are blocked</b> for this site. Allow them in your browser or phone settings for this site, then come back.',
    unsupported: '<b>This browser can’t show notifications.</b> Use Chrome on Android, or Safari on iPhone with the page added to the Home Screen.' }[st];
}
if (KEY()) { app.innerHTML = '<div class="login"><span class="lbl">Opening your orders…</span></div>'; load(true); } else login();
</script></body></html>
