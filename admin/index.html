<style>
/* ---------- Skin Lab admin · dark, calm, nothing overlaps: every row wraps, every text can shrink ---------- */
:root{--bg:#09090b;--s1:#111114;--s2:#17171b;--s3:#1f1f25;--fg:#f4f4f5;--mute:#9a9aa3;--dim:#6b6b74;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);

:focus-visible{outline:2px solid var(--y);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.lbl{font-family:var(--mono);font-size:10.5px;line-height:1.4;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

.pill.new{background:var(--ybg);color:var(--y)}.pill.confirmed,.pill.artwork{background:var(--bbg);color:var(--b)}.pill.printing,.pill.qc{background:var(--pbg);color:var(--p)}.pill.ready,.pill.on-the-way{background:var(--obg);color:var(--o)}

.dgrid{display:grid;gap:12px;margin-top:14px}@media(min-width:900px){.dgrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}

.flow button.on{background:var(--fg);color:#000;border-color:var(--fg)}.flow button.done{border-color:rgba(34,197,94,.45);color:#bbf7d0}.flow.exc button{border-style:dashed}.flow.exc button.on{background:var(--r);border-color:var(--r);color:#000}
.hist{display:grid;gap:0;font-size:13.5px}.hist div{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:0 0 12px;position:relative}.hist div:before{content:'';width:9px;height:9px;border-radius:50%;background:var(--line2);margin-top:6px}

.payst{display:flex;gap:12px;align-items:flex-start}.payst .big{font-size:26px;font-weight:600;letter-spacing:-.02em}

.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line2);border-radius:var(--rad2);text-decoration:none;font-size:14px;margin-top:8px;padding:0 14px;background:var(--s1)}
textarea.msg{min-height:96px;font:14px/1.5 Geist,sans-serif;resize:vertical}
.note{background:var(--s2);border-radius:var(--rad2);padding:10px 12px;margin-top:8px;font-size:14px}.note small{display:block;color:var(--mute);margin-top:4px}
.stars{color:var(--y);letter-spacing:2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:#000;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:999px;z-index:90;max-width:calc(100% - 32px);text-align:center}
/* payments + reviews + support cards */
.pay{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:grid;gap:6px}.pay .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pay .ph b{font-size:22px;font-weight:600}
.pay p{font-size:14px;color:#d4d4d8}.pit{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}.pit ul{margin:6px 0 0;padding-left:18px;color:#c9c9cf}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.pbar label{display:flex;gap:6px;align-items:center}
.rvph{width:100%;max-height:260px;object-fit:cover;border-radius:var(--rad2);display:block}
/* notifications switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}.sw b{display:block;color:#fff;font-size:15px}.sw small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.tg{flex:none;width:52px;height:30px;border-radius:15px;background:#3f3f46;position:relative;transition:background .2s}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--g)}.tg.on i{transform:translateX(22px)}.lnk2{margin-top:10px;font-size:13px;color:#bbb;text-decoration:underline}

.add{background:var(--s1);border:1px solid var(--line2);border-radius:var(--rad);padding:16px;display:grid;gap:12px;margin-top:16px}.ah{font-weight:600;display:flex;gap:10px;align-items:center}.ah b{width:24px;height:24px;flex:none;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:13px}
.pick{display:grid;gap:4px;place-items:center;text-align:center;border:1px dashed var(--line2);border-radius:var(--rad2);padding:22px 12px;cursor:pointer}.pick input{display:none}.pick span{font-weight:600}
.ck{display:flex;gap:10px;align-items:center;font-size:14px;color:#ddd}.ck input[type=checkbox]{width:20px;height:20px;flex:none}
.stg,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.stg:empty{display:none}
.sti{position:relative;background:var(--s3);border-radius:var(--rad2);aspect-ratio:1;display:grid;place-items:center;padding:6px}.sti img{max-width:100%;max-height:100%;display:block}.sti button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);font-size:11px}

.go{min-height:52px;background:var(--fg);color:#000;font-weight:600;border-radius:var(--rad2)}.go:disabled{opacity:.4}
.pkx{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin-bottom:12px;display:grid;gap:10px}.pkh{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:start}.pkh img{width:90px;display:block;border-radius:8px}.pkh b{display:block;font-size:17px}.row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.fl2{display:grid;gap:4px}.fl2 .inp,.fl2 select{min-height:44px}

.qbig b{font-size:24px;font-weight:600;letter-spacing:-.02em}.qbig>div:first-child b{color:var(--y);font-size:30px}.qbig b.dim{color:#a1a1aa}.qbig b.g{color:var(--g)}.qbig small{color:var(--mute);font-size:12px}

</style></head><body>
<div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); };
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } };
const KEY = () => ls('sl-admin'), ME = () => ls('sl-admin-name') || 'Admin';
// order lifecycle (same list as the server)
const FLOW = ['new', 'confirmed', 'artwork', 'printing', 'qc', 'ready', 'on-the-way', 'delivered'];
const EXC = ['clarify', 'hold', 'failed-delivery', 'cancelled', 'refund-review', 'refunded'];
const ST = { new: 'New', confirmed: 'Confirmed', artwork: 'Artwork', printing: 'Printing', qc: 'Quality check', ready: 'Ready', 'on-the-way': 'Out for delivery', delivered: 'Delivered',
  clarify: 'Needs clarification', hold: 'On hold', 'failed-delivery': 'Delivery failed', cancelled: 'Cancelled', 'refund-review': 'Refund in progress', refunded: 'Refunded',
  paid: 'Paid (Paystack)', 'payment-mismatch': 'Payment mismatch', 'customer-note': 'Customer note updated', 'refund-failed': 'Refund failed' };
const STAGE = { todo: ['new'], prod: ['confirmed', 'artwork', 'printing', 'qc'], ship: ['ready', 'on-the-way'], done: ['delivered'], issues: ['clarify', 'hold', 'failed-delivery', 'refund-review'], closed: ['cancelled', 'refunded'] };
let ROLE = 'owner', view = 'orders', orders = [], filter = 'todo', payFilter = '', q = '', PAYON = false, seen = new Set(JSON.parse(ls('sl-admin-seen') || '[]')), timer = 0, tickets = null, reviews = null;
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const when = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const cedi = n => '₵' + (Math.round((n || 0) * 100) / 100).toLocaleString('en-GB');
const first = n => (n || '').split(' ')[0];
const kind = k => /^skin~/.test(k) ? 'laptop skin' : /^kb~/.test(k) ? 'keyboard skin' : /^(ms|tp)~/.test(k) ? 'trackpad skin' : /^dc~/.test(k) ? 'vinyl decal' : 'sticker sheet';
const what = o => [o.design ? `${o.design.packName || 'Custom pack'} (${o.design.size || '–'}, ${o.design.n} stickers)` : '', ...(o.packs || []).map(p => `${p.q}× ${p.label}`), (o.singles || []).length ? `${o.singles.reduce((a, s) => a + s.q, 0)} singles` : ''].filter(Boolean).join(' · ');

async function makeSheet(p) {   // the pack's Skin Lab sheet (A4) from its stickers

  const PX = 1240, Wm = 210, Hm = 297, k = PX / Wm, c = Object.assign(document.createElement('canvas'), { width: PX, height: Math.round(Hm * k) }), g = c.getContext('2d'), W = c.width, H = c.height, hd = Wm * .15 * k;

  g.fillStyle = '#FFD21F'; g.fillText('LAB', m * 1.6 + sw, hd * .44); g.fillStyle = '#ccc'; g.font = `italic 400 ${hd * .1}px Georgia, serif`; g.fillText('by Baiden Creatives', m * 1.6, hd * .64);
  const tx = W * .36; g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(tx - W * .025, hd * .27, 2, hd * .46);
  g.fillStyle = '#fff'; g.font = `800 ${hd * .17}px Geist, Arial, sans-serif`; g.fillText(String(p.name).toUpperCase().slice(0, 22), tx, hd * .38);
  g.font = `500 ${hd * .085}px Geist, Arial, sans-serif`; g.fillStyle = '#ddd'; g.fillText(p.tag || 'fresh from the shop', tx, hd * .55);

// ---------- phone notifications for new orders ----------
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let swReg = null; if ('serviceWorker' in navigator) navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).then(r => swReg = r).catch(() => {});
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function notifState() { if (!('serviceWorker' in navigator) || !('PushManager' in window)) return isIOS && !standalone ? 'ios-install' : 'unsupported';
  if (Notification.permission === 'denied') return 'denied'; const r = swReg || await navigator.serviceWorker.ready; const sub = await r.pushManager.getSubscription(); return sub ? 'on' : 'off'; }
async function notifCard() { const el = $('#nt'); if (!el) return; const st = await notifState().catch(() => 'unsupported');
  if (st === 'on' || st === 'off') {
    el.innerHTML = `<div class="sw"><span><b>Order notifications</b><small>${st === 'on' ? 'On for this phone · you get a ping for every new order, even with the app closed' : 'Off · turn on to get a ping for every new order'}</small></span>
      <button class="tg ${st === 'on' ? 'on' : ''}" id="tg" role="switch" aria-checked="${st === 'on'}" aria-label="Order notifications"><i></i></button></div>${st === 'on' ? '<button class="lnk2" id="ntt">Send a test notification</button>' : ''}`;
    $('#tg').onclick = async () => { const t = $('#tg'); t.disabled = true; t.classList.toggle('on');
      try { const r = swReg || await navigator.serviceWorker.ready;
        if (st === 'on') { const sub = await r.pushManager.getSubscription(); if (sub) { await api('/api/subscribe/', { method: 'DELETE', body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); } toast('Notifications off'); }
        else { const p = await Notification.requestPermission(); if (p !== 'granted') return notifCard();
          const { publicKey } = await api('/api/subscribe/'), sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
          await api('/api/subscribe/', { method: 'POST', body: JSON.stringify({ sub }) }); toast('Notifications on'); api('/api/admin/', { method: 'POST', body: JSON.stringify({ a: 'push-test' }) }).catch(() => {}); }
      } catch (e) { toast(e.message || 'Could not change it'); } notifCard(); };
    if ($('#ntt')) $('#ntt').onclick = async () => { const r = await api('/api/admin/', { method: 'POST', body: JSON.stringify({ a: 'push-test' }) }).catch(e => ({ result: e.message })); toast('Sent · ' + r.result); };
    return; }
  el.innerHTML = { 'ios-install': '<b>On iPhone, add this page to your Home Screen first:</b> tap Share ⬆︎ then “Add to Home Screen”, open “SL Orders” from your Home Screen, then switch notifications on here.',
    denied: '<b>Notifications are blocked</b> for this site. Allow them in your browser or phone settings for this site, then come back.',
    unsupported: '<b>This browser can’t show notifications.</b> Use Chrome on Android, or Safari on iPhone with the page added to the Home Screen.' }[st];
}

if (KEY()) { app.innerHTML = '<div class="login"><span class="lbl">Opening your orders…</span></div>'; load(true).then(counts); } else login();
